server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: business-plan-generator
  datasource:
    url: ${DATABASE_URL:jdbc:h2:mem:bpgdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL}
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: ${DATABASE_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: false
  h2:
    console:
      enabled: true
      path: /h2-console

app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours
  ai:
    provider: ${AI_PROVIDER:gemini}
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:gemini-1.5-flash}
      base-url: https://generativelanguage.googleapis.com
      timeout-seconds: 60
    openai:
      api-key: ${OPENAI_API_KEY:}
      model: ${OPENAI_MODEL:gpt-4o-mini}
  razorpay:
    key-id: ${RAZORPAY_KEY_ID:rzp_test_mock_key}
    key-secret: ${RAZORPAY_KEY_SECRET:rzp_test_mock_secret}
    webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:mock_webhook_secret}
    mock-mode: ${RAZORPAY_MOCK_MODE:true}
  cors:
    allowed-origins: ${FRONTEND_URL:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
