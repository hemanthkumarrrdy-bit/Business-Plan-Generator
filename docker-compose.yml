version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: bpg_postgres
    restart: always
    environment:
      POSTGRES_DB: bpg_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bpg_backend
    restart: always
    depends_on:
      - postgres
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/bpg_db
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgrespassword
      SERVER_PORT: 8080
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-rzp_test_mock_key}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-rzp_test_mock_secret}
    ports:
      - "8080:8080"

volumes:
  pgdata:
